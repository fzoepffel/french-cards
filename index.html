<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Neno" />
    <meta name="theme-color" content="#fff5ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#241a16" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Neno — Französisch Vokabeln</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  <script>
setTimeout(() => {
  const b = [...document.querySelectorAll('button.big')].find(x => /round|beginning|Runde|vorne/i.test(x.textContent))
  b && b.click()
}, 2500)
setTimeout(() => {
  const sc = document.querySelector('.scroller')
  const dock = document.querySelector('.dock-layer')
  const m = document.querySelector('main.review')
  document.title = 'pageSH=' + document.documentElement.scrollHeight + ' innerH=' + innerHeight +
    ' mainH=' + (m && Math.round(m.getBoundingClientRect().height)) +
    ' scrollerH=' + (sc && Math.round(sc.getBoundingClientRect().height)) +
    ' content=' + (sc && sc.scrollHeight) +
    ' dockTop=' + (dock && Math.round(dock.getBoundingClientRect().top)) +
    ' buttons=' + [...document.querySelectorAll('button')].slice(0, 4).map(b => b.textContent.slice(0, 22)).join('/')
}, 6000)
</script>
</body>
</html>
